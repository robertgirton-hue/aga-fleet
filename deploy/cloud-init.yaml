#cloud-config
# Digital Ocean cloud-init for the AGA Fleet droplet
# Provisions Hermes runtime, Memo vault, Postgres, Composio, all nine bots
# Ubuntu 24.04 LTS, 2 vCPU / 4 GB RAM recommended ($24/mo droplet)

package_update: true
package_upgrade: true

packages:
  - git
  - curl
  - build-essential
  - python3.12
  - python3.12-venv
  - python3-pip
  - pipx
  - postgresql-16
  - postgresql-contrib
  - nginx
  - ufw
  - sqlite3
  - jq
  - ripgrep
  - ffmpeg
  - xz-utils

users:
  - name: aga
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: sudo
    shell: /bin/bash
    ssh_authorized_keys:
      - BOB_SSH_PUBLIC_KEY_HERE  # replaced by bootstrap.sh from Bob's Mac

write_files:
  - path: /opt/aga-fleet/.env.template
    content: |
      # Fleet-wide secrets - populated by bootstrap.sh, NEVER committed to git
      TELEGRAM_ZEUS_BOT_TOKEN=
      TELEGRAM_PRESSMASTER_BOT_TOKEN=
      TELEGRAM_PERPLEXITY_BOT_TOKEN=
      BOB_TELEGRAM_USER_ID=
      COMPOSIO_API_KEY=
      NOTION_API_KEY=
      ONEDRIVE_ACCESS_TOKEN=
      ATTIO_API_KEY=
      TODOIST_API_KEY=
      FIREFLIES_API_KEY=
      GITHUB_PAT=
      OPENAI_API_KEY=
      ANTHROPIC_API_KEY=
      PERPLEXITY_API_KEY=
      POSTGRES_PASSWORD=
    permissions: '0600'
    owner: aga:aga

  - path: /etc/systemd/system/aga-hermes.service
    content: |
      [Unit]
      Description=AGA Fleet Hermes runtime
      After=network.target postgresql.service
      Requires=postgresql.service

      [Service]
      Type=simple
      User=aga
      WorkingDirectory=/opt/aga-fleet
      EnvironmentFile=/opt/aga-fleet/.env
      Environment="PATH=/home/aga/.local/bin:/home/aga/.hermes/hermes-agent/venv/bin:/usr/local/bin:/usr/bin:/bin"
      Environment="HERMES_HOME=/home/aga/.hermes"
      ExecStart=/home/aga/.local/bin/hermes gateway run --config /opt/aga-fleet/hermes.yaml
      Restart=always
      RestartSec=10

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/aga-memo.service
    content: |
      [Unit]
      Description=Memo fluid brain MCP server
      After=network.target

      [Service]
      Type=simple
      User=aga
      WorkingDirectory=/opt/aga-fleet/memo-vault
      EnvironmentFile=/opt/aga-fleet/.env
      Environment="PATH=/home/aga/.local/bin:/usr/local/bin:/usr/bin:/bin"
      Environment="MEMO_VAULT=/opt/aga-fleet/memo-vault"
      ExecStart=/home/aga/.local/bin/memo-mcp
      Restart=always
      RestartSec=10

      [Install]
      WantedBy=multi-user.target

runcmd:
  # Firewall
  - ufw allow 22/tcp
  - ufw allow 443/tcp
  - ufw --force enable

  # Postgres setup
  - sudo -u postgres psql -c "CREATE USER aga WITH PASSWORD 'CHANGE_ME_IN_BOOTSTRAP';"
  - sudo -u postgres psql -c "CREATE DATABASE aga_fleet OWNER aga;"
  - sudo -u postgres psql -d aga_fleet -c "CREATE TABLE pending_actions (id SERIAL PRIMARY KEY, bot_name TEXT NOT NULL, bucket INT NOT NULL, action_type TEXT NOT NULL, payload JSONB NOT NULL, status TEXT DEFAULT 'pending', created_at TIMESTAMPTZ DEFAULT NOW(), resolved_at TIMESTAMPTZ);"
  - sudo -u postgres psql -d aga_fleet -c "CREATE TABLE run_log (id SERIAL PRIMARY KEY, bot_name TEXT NOT NULL, run_type TEXT, summary TEXT, payload JSONB, created_at TIMESTAMPTZ DEFAULT NOW());"

  # Repo clone (public repo, no auth needed)
  - install -d -o aga -g aga /opt/aga-fleet
  - sudo -u aga git clone https://github.com/robertgirton-hue/aga-fleet.git /opt/aga-fleet/repo
  - bash -c 'for f in /opt/aga-fleet/repo/*; do bn=$(basename "$f"); [ "$bn" = "deploy" ] && continue; ln -sfn "$f" "/opt/aga-fleet/$bn"; done'
  - chown -R aga:aga /opt/aga-fleet

  # Ensure ~/.local/bin exists and is on aga's PATH
  - sudo -u aga mkdir -p /home/aga/.local/bin
  - sudo -u aga bash -c 'grep -q "HOME/.local/bin" /home/aga/.bashrc || echo "export PATH=\"$HOME/.local/bin:$PATH\"" >> /home/aga/.bashrc'

  # Hermes Agent (official installer, no sudo needed - installs to ~/.local/bin)
  - sudo -u aga -H bash -lc 'curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --skip-browser --skip-setup'

  # Memo MCP (CPU backend for Linux via pipx)
  - sudo -u aga -H bash -lc 'pipx ensurepath && pipx install "mlx-memo[cpu]"'

  # Composio (installed into the same pipx env as memo? no - separate pipx app)
  - sudo -u aga -H bash -lc 'pipx install composio-core'

  # Initialize Memo vault
  - install -d -o aga -g aga /opt/aga-fleet/memo-vault
  - sudo -u aga -H bash -lc 'cd /opt/aga-fleet/memo-vault && /home/aga/.local/bin/memo init || true'

  # Enable services
  - systemctl daemon-reload
  - systemctl enable aga-hermes.service
  - systemctl enable aga-memo.service
  # Do NOT start yet - .env must be populated by bootstrap.sh first

final_message: |
  AGA Fleet droplet provisioned.
  Next step from Bob's Mac: ./deploy/bootstrap.sh <droplet-ip>
  This will push .env secrets, then start Hermes + Memo services.
